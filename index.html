        class BookCard extends HTMLElement{
            constructor(){
                super();
                this.attachShadow({mode: 'open'});
            }
            connectedCallback(){
                this.updateContent();
            }
            static get observedAttributes(){
                return ['month', 'title', 'author', 'genre', 'audience', 'format', 'publishyear', 'url'];
            }
            attributeChangedCallback(name, oldValue, newValue){
                this.updateContent();

                this.shadowRoot.innerHTML = `
                    <style>
  .book__wrap:hover .book__description_layer {
    visibility: visible;
    opacity: 1;
  }

  .book__description {
    transition: .2s;
  }

  .book__wrap:hover .book__description {
    transform: translateY(0);
  }

  .book__wrap {
    position: relative;
    width: 250px;
    margin: 5px;
break-inside: avoid;
  margin-bottom: 1rem;
  display: inline-block;
  width: calc(100% - 10px);
  }

  .book__description_layer {
    position: absolute;
    top: 0;
    bottom: 0;
    left: 0;
    right: 0;
    color: black;
    visibility: hidden;
    opacity: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    /* transition effect. not necessary */
    transition: opacity .15s, visibility .2s;
    height: 100%;
    width: 100%;
    border: 5px solid blue;
  }

.book__img{
  width:100%
}
  .book__wrap:hover .book__img, 
  .book__wrap:focus .book__img 
{
    -webkit-filter: blur(20px);
    filter: blur(20px);
}
                    </style>

<div class="book__wrap">

          <p><b>${this.getAttribute('title')}</b></p>
          <p>by ${this.getAttribute('author')}</p>
        </div>
      </div>
    </div>`;
            }

        class AudienceSelectorRadio extends HTMLElement {
            constructor(){
                super();
                this.attachShadow({mode: 'open'});
            }
            async connectedCallback(){
                this.updateContent();
                // Move icon to whichever radio is selected
                this.shadowRoot.addEventListener('change', (e) => {
                    if (e.target.name === 'audience') {
                        const icon = this.querySelector('[slot^="icon-"]');
                        if (icon) icon.setAttribute('slot', `icon-${e.target.value}`);
                        //send the signal out
                        this.dispatchEvent(new CustomEvent('selector-change', {
                            detail: { type: 'audience', value: e.target.value },
                            bubbles: true,
                            composed: true
                        }));
                    }
                });
                
            }
            static get observedAttributes(){
                return ['audience'];
            }
            attributeChangedCallback(name, oldValue, newValue){
                this.updateContent();
            }
            updateContent(){
                const baseInnerHTML= [`
                <style>
                    label {
                        height: auto;
                        border-radius: 20px;
                        padding: 0.5rem;
                        text-align: center;
                        box-shadow: 0 4px 8px 0 rgba(0, 0, 0, 0.2);
                        position: relative;
                        margin: 5px;
                        display: flex;
                    }
                    /*Label on hover*/
                    label:hover
                    {
                        color: #2F6B3E;
                    }
                    input[type="radio"] {
                        display: none;
                        &:not(:disabled) ~ label {
                            cursor: pointer;
                        }
                    }
                    /*Radio Button clicked
                    */
                    input[type="radio"]:checked + label {
                        color: #6e853d;
                        background: #d4d68d;
                        box-shadow: 0 4px 8px 0 whitesmoke;
                    }
                    /* Hide the icon slot by default */
                    slot[name="icon"] {
                    display: none;
                    }
                    /* Show it only when the radio is checked */
                    input[type="radio"]:checked ~ label slot[name="icon"] {
                    display: inline-block;
                    }
                </style>
                <input type="radio" id="All" name="audience" value="All" checked> 
                    <label for="All"><slot name="icon-All"></slot>All</label> 
                </input>`];
                this.getAttribute('audience').split(',').filter(Boolean).map((audience) => {
                    baseInnerHTML.push(
                        `<input type="radio" id="${audience}" name="audience" value="${audience}"> 
                            <label for="${audience}"><slot name="icon-${audience}"></slot>${audience}</label> 
                        </input>`);
                    });
                this.shadowRoot.innerHTML= baseInnerHTML.join('\n');
            }
        }

                            composed: true

            customElements.define('audience-selector', AudienceSelectorRadio);
            customElements.define('genre-selector', GenreSelectorCheckboxes);
            customElements.define('format-selector', FormatSelectorRadio);


            //=====================================================================
            //functions to filter the books
            //=====================================================================
            function getSelectedValue(selectorId, name) {
                const shadow = document.getElementById(selectorId)
                    .querySelector(`${name}-selector`).shadowRoot;
                return shadow.querySelector(`input[name="${name}"]:checked`)?.value ?? 'All';
            }

            function filterBooks() {
                const genre = getSelectedValue('GenreSelector', 'genre');
                const audience = getSelectedValue('AudienceSelector', 'audience');
                const format = getSelectedValue('FormatSelector', 'format');

                this.DisplayBooks = this.Books.filter(b =>
                    (genre === 'All' || b.Genre === genre) &&
                    (audience === 'All' || b.Audience === audience) &&
                    (format === 'All' || b.Format === format)
                );
                // re-render BooksListDisplay from this.DisplayBooks
                document.getElementById('BooksListDisplay').replaceChildren();
                this.DisplayBooks.forEach((book) => {
                const bookCard = document.createElement('book-card');
                bookCard.setAttribute('month', book.Month);
                bookCard.setAttribute('title', book.Title);
                bookCard.setAttribute('author', book.Author);
                bookCard.setAttribute('genre', book.Genre);
                bookCard.setAttribute('audience', book.Audience);
                bookCard.setAttribute('format', book.Format);
                bookCard.setAttribute('publishyear', book.PublishYear);
                bookCard.setAttribute('url', book.URL);
                document.getElementById('BooksListDisplay').appendChild(bookCard);
            });
            }

            document.getElementById('BookListSelectors').addEventListener('selector-change', (e) => {
                const { type, value } = e.detail;
                console.log(`${type} changed to ${value}`);
                filterBooks(); // your future filtering logic reads current radio states
            });
        });
